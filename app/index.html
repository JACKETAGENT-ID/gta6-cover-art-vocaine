<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Postcard — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice City Postcard</h1>
    <p class="tagline">Your photos, a retro travel-poster frame, and a bold caption — exported as a PNG to share.</p>

    <fieldset class="photos">
      <legend>Photos — pick a slot, then load a photo or a painted scene</legend>
      <div class="slot" id="slot-0">
        <span class="slot-name">Photo 1</span>
        <label class="file">Upload <input id="file-0" type="file" accept="image/*"></label>
        <label class="zoom">Zoom <input id="zoom-0" type="range" min="1" max="2.5" step="0.05" value="1"></label>
        <button id="pick-0" type="button">Edit this one</button>
      </div>
      <div class="slot" id="slot-1">
        <span class="slot-name">Photo 2</span>
        <label class="file">Upload <input id="file-1" type="file" accept="image/*"></label>
        <label class="zoom">Zoom <input id="zoom-1" type="range" min="1" max="2.5" step="0.05" value="1"></label>
        <button id="pick-1" type="button">Edit this one</button>
      </div>
      <div class="slot" id="slot-2">
        <span class="slot-name">Photo 3</span>
        <label class="file">Upload <input id="file-2" type="file" accept="image/*"></label>
        <label class="zoom">Zoom <input id="zoom-2" type="range" min="1" max="2.5" step="0.05" value="1"></label>
        <button id="pick-2" type="button">Edit this one</button>
      </div>
      <div class="samples">
        <span>Painted scenes:</span>
        <button id="sample-marina" type="button">Marina dusk</button>
        <button id="sample-palmrow" type="button">Neon avenue</button>
        <button id="sample-boardwalk" type="button">Boardwalk</button>
      </div>
      <p class="hint">Drag the cover to pan the active photo.</p>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Kicker <input id="kicker" type="text" maxlength="30" value="Greetings from"></label>
      <label>Title <input id="title" type="text" maxlength="24" value="Vice City"></label>
      <label>Place line <input id="place" type="text" maxlength="30" value="Ocean Drive"></label>
    </fieldset>

    <fieldset>
      <legend>Panels</legend>
      <label class="radio"><input type="radio" name="layout" value="postcard"> Postcard · one photo</label>
      <label class="radio"><input type="radio" name="layout" value="triptych" checked> Triptych · three panels</label>
      <label class="radio"><input type="radio" name="layout" value="split"> Split · one big, two small</label>
      <label class="radio"><input type="radio" name="layout" value="stack"> Stack · three bands</label>
    </fieldset>

    <fieldset>
      <legend>Colour grade</legend>
      <label class="radio"><input type="radio" name="grade" value="duotone" checked> Duotone teal–orange</label>
      <label class="radio"><input type="radio" name="grade" value="sepia"> Sepia postcard</label>
      <label class="radio"><input type="radio" name="grade" value="mono"> Mono</label>
      <label class="radio"><input type="radio" name="grade" value="original"> Original</label>
      <label class="radio"><input type="radio" name="grade" value="noir"> Noir</label>
    </fieldset>

    <fieldset>
      <legend>Post size</legend>
      <label class="radio"><input type="radio" name="size" value="square" checked> Square · 1080 × 1080</label>
      <label class="radio"><input type="radio" name="size" value="portrait"> Portrait · 1080 × 1350</label>
      <label class="radio"><input type="radio" name="size" value="wide"> Wide · 1920 × 1080</label>
    </fieldset>

    <button id="export" type="button" class="export">Export PNG 1080 x 1080</button>
    <p id="status" role="status"></p>
  </section>
  <canvas id="preview" width="1080" height="1080" aria-label="The postcard cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
